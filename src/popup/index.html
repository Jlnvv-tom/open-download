<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Download</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <h1>Open Download</h1>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-listening">
        <span class="slider"></span>
      </label>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">已捕获</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-downloaded">0</span>
        <span class="stat-label">已下载</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-failed">0</span>
        <span class="stat-label">失败</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-matching">0</span>
        <span class="stat-label">匹配</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-selected">0</span>
        <span class="stat-label">已选</span>
      </div>
    </div>

    <div class="media-tabs" id="media-tabs">
      <button class="tab active" data-media-type="image">图片 <span>0</span></button>
      <button class="tab" data-media-type="video">视频 <span>0</span></button>
    </div>

    <div class="format-tabs" id="format-tabs"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="搜索 URL / 文件名 / 域名...">
      </div>
      <button class="btn-icon" id="btn-filter" title="筛选">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
      </button>
      <button class="btn-icon active" id="btn-view-list" title="列表视图">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
      </button>
      <button class="btn-icon" id="btn-view-card" title="卡片视图">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>
      <button class="btn-icon" id="btn-clear" title="清空">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
    </div>

    <!-- Filter Panel (collapsible) -->
    <div class="filter-panel" id="filter-panel" style="display: none;">
      <div class="filter-row">
        <label>最小大小 (KB)</label>
        <input type="number" id="filter-min-size" placeholder="0" min="0">
      </div>
      <div class="filter-row size-row">
        <label>内容大小</label>
        <div class="size-control">
          <input type="range" id="content-size-range" min="88" max="220" step="4">
          <input type="number" id="content-size-input" min="88" max="220" step="4">
        </div>
      </div>
      <div class="filter-row">
        <label>扩展名 (逗号分隔)</label>
        <input type="text" id="filter-extensions" placeholder=".jpg,.png,.webp">
      </div>
    </div>

    <!-- Media List -->
    <div class="image-list" id="image-list">
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <p>开启监听后，浏览网页时捕获的图片将显示在这里</p>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn-secondary" id="btn-select-all">全选</button>
      <button class="btn-secondary" id="btn-export">导出列表</button>
      <button class="btn-primary" id="btn-download-selected">下载选中</button>
      <button class="btn-primary" id="btn-download-all">全部下载</button>
    </footer>

    <!-- Status indicator -->
    <div class="status-indicator" id="status-indicator">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">监听已关闭</span>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
