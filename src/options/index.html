<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Download</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <!-- 静态文案统一由 data-i18n* 属性驱动，运行时由 applyI18n() 填充 -->
  <div class="container">
    <h1 data-i18n="optionsTitle"></h1>

    <section class="card">
      <h2 data-i18n="optionsDownloadSection"></h2>

      <div class="form-row">
        <label>
          <input type="checkbox" id="auto-download">
          <span data-i18n="optionsAutoDownload"></span>
        </label>
      </div>

      <div class="form-row">
        <label data-i18n="optionsSavePath"></label>
        <input type="text" id="save-path" placeholder="OpenDownload">
        <small data-i18n="optionsSavePathHint"></small>
      </div>

      <div class="form-row">
        <label data-i18n="optionsFileNaming"></label>
        <select id="file-naming">
          <option value="original" data-i18n="optionsNamingOriginal"></option>
          <option value="domain" data-i18n="optionsNamingDomain"></option>
          <option value="sequential" data-i18n="optionsNamingSequential"></option>
        </select>
      </div>

      <div class="form-row">
        <label data-i18n="optionsConcurrency"></label>
        <input type="number" id="concurrency" min="1" max="10" value="3">
        <small data-i18n="optionsConcurrencyHint"></small>
      </div>

      <div class="form-row">
        <label>
          <input type="checkbox" id="video-direct">
          <span data-i18n="optionsVideoDirect"></span>
        </label>
        <small data-i18n="optionsVideoDirectHint"></small>
      </div>

      <div class="form-row">
        <label>
          <input type="checkbox" id="send-cookies">
          <span data-i18n="optionsSendCookies"></span>
        </label>
        <small data-i18n="optionsSendCookiesHint"></small>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="optionsFilterSection"></h2>

      <div class="form-row">
        <label data-i18n="optionsMinSize"></label>
        <input type="number" id="min-size" min="0" placeholder="0">
        <small data-i18n="optionsMinSizeHint"></small>
      </div>

      <div class="form-row">
        <label data-i18n="optionsMaxSize"></label>
        <input type="number" id="max-size" min="0" placeholder="0">
        <small data-i18n="optionsMaxSizeHint"></small>
      </div>

      <div class="form-row">
        <label data-i18n="optionsCaptureTypes"></label>
        <div class="checkbox-group">
          <label><input type="checkbox" id="capture-image" checked> <span data-i18n="optionsCaptureImage"></span></label>
          <label><input type="checkbox" id="capture-video" checked> <span data-i18n="optionsCaptureVideo"></span></label>
        </div>
        <small data-i18n="optionsCaptureTypesHint"></small>
      </div>

      <div class="form-row">
        <label data-i18n="optionsExcludeDomains"></label>
        <textarea id="exclude-domains" rows="4" placeholder="example.com&#10;cdn.example.com"></textarea>
        <small data-i18n="optionsExcludeDomainsHint"></small>
      </div>

      <div class="form-row">
        <label data-i18n="optionsExtensions"></label>
        <input type="text" id="filter-extensions" placeholder=".jpg,.png,.webp,.mp4,.webm">
        <small data-i18n="optionsExtensionsHint"></small>
      </div>

      <div class="form-row">
        <label>
          <input type="checkbox" id="dedupe" checked>
          <span data-i18n="optionsDedupe"></span>
        </label>
        <small data-i18n="optionsDedupeHint"></small>
      </div>
    </section>

    <div class="actions">
      <button class="btn-primary" id="btn-save" data-i18n="optionsSaveBtn"></button>
      <button class="btn-secondary" id="btn-reset" data-i18n="optionsResetBtn"></button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
