name: Build & Release

# 推送代码到 master 时：校验版本 → 测试 → 打包上传 → 版本变化则自动打标签发版
# 也可在 Actions 页面手动触发

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./src/manifest.json').version")
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::版本不一致：package.json=$PKG_VERSION, src/manifest.json=$MANIFEST_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run pack

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: open-download-${{ steps.version.outputs.version }}
          path: packages/open-download-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create tag and release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "标签 $TAG 已存在，跳过打标签与发版（安装包已作为 Action 产物上传）。"
            exit 0
          fi

          git tag -d "$TAG" >/dev/null 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "Open Download v$VERSION" \
            --generate-notes \
            "packages/open-download-$VERSION.zip"

          echo "已发布 $TAG，安装包：packages/open-download-$VERSION.zip"
