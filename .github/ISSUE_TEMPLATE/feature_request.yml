name: 功能建议
description: 提出新的使用场景或改进想法
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 场景描述
      description: 你想完成什么事？当时在什么页面、什么操作下卡住了？
      placeholder: 我在下载一个图片库时希望…
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 当前是怎么绕过去的
      description: 如果现在已有替代做法（哪怕很麻烦），请写出来，这能帮助判断优先级
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 期望的形态
      description: 你希望它在界面上长什么样、怎么操作
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 扩展版本
      placeholder: 1.6.0
    validations:
      required: false
